# Manual live acceptance of the deployed coach room: a bounded set of fresh explanation
# requests (scripts/live_acceptance.py). No secrets; it calls the public site only.
name: Live acceptance on Azure

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed app to check
        default: https://live-sub-intel-fcfudheze9b5ewfz.swedencentral-01.azurewebsites.net
        required: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Right after a deploy, the previous instance can still answer for a while; wait until this commit
      # answers three times in a row so the results cover a single build (the report records it either way).
      - name: Wake the app and wait for this commit
        run: |
          streak=0
          for attempt in $(seq 1 40); do
            sha=$(curl -sS --max-time 60 "${{ inputs.base_url }}/healthz" | python -c "import json,sys; print(json.load(sys.stdin).get('build_sha') or '')" || true)
            if [ "$sha" = "${{ github.sha }}" ]; then streak=$((streak+1)); else streak=0; fi
            echo "healthz build_sha=${sha:-unknown} (${streak}/3)"
            [ "$streak" -ge 3 ] && exit 0
            sleep 10
          done
          echo "::warning::${{ inputs.base_url }} did not consistently report ${{ github.sha }}; the report records the builds it served."

      - name: Run bounded acceptance requests
        run: python scripts/live_acceptance.py "${{ inputs.base_url }}" --out live_acceptance.json --require-model --extended-audiences

      - name: Print the full report
        if: always()
        run: cat live_acceptance.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-acceptance
          path: live_acceptance.json
